version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: erp-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
      POSTGRES_DB: erp_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
